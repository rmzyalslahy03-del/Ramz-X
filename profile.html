<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>الملف الشخصي | Ramz-X</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            padding-bottom: 70px;
            transition: background 0.3s;
        }
        body.dark { background-color: #000; }
        body.light { background-color: #f5f5f5; }
        body.light .profile-container,
        body.light .header,
        body.light .profile-header,
        body.light .tabs,
        body.light .settings-panel,
        body.light .post-item {
            background-color: #fff;
            color: #000;
        }
        body.light .header h1,
        body.light .item-name,
        body.light .profile-name,
        body.light .post-title {
            color: #000;
        }
        body.light .item-detail,
        body.light .profile-bio,
        body.light .profile-stats span,
        body.light .post-excerpt {
            color: #555;
        }
        body.light .tab {
            color: #555;
        }
        body.light .tab.active {
            color: #ff0050;
        }
        body.light .settings-input {
            background: #f0f0f0;
            border-color: #ccc;
            color: #000;
        }
        .profile-container {
            max-width: 500px;
            margin: 0 auto;
            background: #000;
            min-height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #000;
            border-bottom: 0.5px solid #2c2c2c;
        }
        .back-btn, .settings-header-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        .header h1 {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }
        .profile-header {
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-bottom: 0.5px solid #2c2c2c;
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            background: #2c2c2c;
            margin-bottom: 12px;
            border: 3px solid #ff0050;
        }
        .profile-name {
            font-size: 22px;
            font-weight: bold;
            color: white;
            margin-bottom: 4px;
        }
        .profile-username {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 12px;
        }
        .profile-bio {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 16px;
            max-width: 300px;
        }
        .profile-stats {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin-bottom: 16px;
        }
        .profile-stats span {
            font-size: 14px;
            color: #aaa;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .profile-stats strong {
            font-size: 18px;
            color: white;
        }
        .follow-btn {
            background: #ff0050;
            border: none;
            padding: 8px 24px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }
        .follow-btn.following {
            background: #2c2c2c;
            color: white;
        }
        .social-links {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin: 16px 0 8px;
        }
        .social-links a {
            color: #aaa;
            font-size: 20px;
            transition: 0.2s;
        }
        .social-links a:hover {
            color: #ff0050;
        }
        .unique-url {
            font-size: 12px;
            color: #777;
            margin-top: 8px;
        }
        .tabs {
            display: flex;
            border-bottom: 0.5px solid #2c2c2c;
            background: #000;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            background: none;
            border: none;
            color: #aaa;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
        }
        .tab.active {
            color: white;
            border-bottom-color: #ff0050;
        }
        .content-area {
            padding: 16px;
        }
        .post-item {
            background: #111;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        body.light .post-item {
            background: #f9f9f9;
            border: 1px solid #eee;
        }
        .post-title {
            font-weight: bold;
            color: white;
            margin-bottom: 4px;
        }
        .post-excerpt {
            font-size: 13px;
            color: #aaa;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
        .settings-panel {
            background: #111;
            border-radius: 16px;
            padding: 16px;
            margin-top: 16px;
        }
        .settings-group {
            margin-bottom: 20px;
        }
        .settings-label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: white;
            margin-bottom: 8px;
        }
        body.light .settings-label {
            color: #000;
        }
        .settings-input {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #2c2c2c;
            background: #1a1a1a;
            color: white;
            font-family: 'Cairo', sans-serif;
            margin-bottom: 12px;
        }
        .settings-textarea {
            resize: vertical;
            min-height: 80px;
        }
        .settings-save-btn {
            background: #ff0050;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .avatar-upload {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .avatar-preview-small {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
        }
        .file-input-label {
            background: #2c2c2c;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 12px;
        }
        .bottom-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #fff;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid #ddd;
            z-index: 30;
        }
        body.dark .bottom-footer {
            background-color: #111;
            border-top-color: #2c2c2c;
        }
        .footer-button {
            background: none;
            border: none;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            color: #333;
            text-decoration: none;
        }
        body.dark .footer-button {
            color: #aaa;
        }
        .footer-button:hover {
            color: #ff0050;
            transform: scale(1.05);
        }
        .icon {
            font-size: 22px;
            display: block;
            margin-bottom: 4px;
        }
        .label {
            font-size: 11px;
            color: #333;
        }
        body.dark .label {
            color: #aaa;
        }
        #globalToast {
            position: fixed;
            bottom: 80px;
            left: 20px;
            right: 20px;
            background: #1f1f1f;
            color: white;
            padding: 12px 16px;
            border-radius: 40px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            font-size: 14px;
            border-left: 4px solid #fe2c55;
        }
        body.light #globalToast {
            background: #333;
        }
    </style>
</head>
<body>
<div class="profile-container">
    <div class="header">
        <button class="back-btn" onclick="window.location.href='home.html'"><i class="fas fa-arrow-right"></i></button>
        <h1>الملف الشخصي</h1>
        <button class="settings-header-btn" id="settingsHeaderBtn" style="display: none;"><i class="fas fa-cog"></i></button>
    </div>

    <div id="profileHeader" class="profile-header"></div>

    <div class="tabs" id="profileTabs">
        <button class="tab active" data-tab="posts">منشوراتي</button>
        <button class="tab" data-tab="favorites">المفضلات</button>
        <button class="tab" id="settingsTabBtn" data-tab="settings" style="display: none;">الإعدادات</button>
    </div>

    <div id="profileContent" class="content-area"></div>
</div>

<div class="bottom-footer">
    <a href="home.html" class="footer-button"><i class="fas fa-home icon"></i><div class="label">الرئيسية</div></a>
    <a href="explore.html" class="footer-button"><i class="fas fa-compass icon"></i><div class="label">استكشاف</div></a>
    <a href="create-post.html" class="footer-button"><i class="fas fa-plus-circle icon"></i><div class="label">إنشاء</div></a>
    <a href="inbox.html" class="footer-button"><i class="fas fa-inbox icon"></i><div class="label">صندوق الوارد</div></a>
    <a href="profile.html" class="footer-button"><i class="fas fa-user icon"></i><div class="label">الملف الشخصي</div></a>
</div>

<div id="globalToast"></div>

<script>
    // ---------------------- Supabase Config ----------------------
    const SUPABASE_URL = "https://zlkpoghjbqtnhzhmmdbw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7evDsA5aEgPMsRBTFjntrg_XZQFmNLw";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let viewedUser = null;

    // ---------------------- Toast ----------------------
    function showToast(msg, isError = false) {
        const toast = document.getElementById('globalToast');
        toast.textContent = msg;
        toast.style.opacity = '1';
        toast.style.backgroundColor = isError ? '#3a1e1e' : '#1f1f1f';
        toast.style.borderLeftColor = isError ? '#ff4444' : '#fe2c55';
        setTimeout(() => toast.style.opacity = '0', 3000);
    }

    // ---------------------- Helper Functions ----------------------
    function formatNumber(num) {
        if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
        if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
        return num.toString();
    }
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }

    // ---------------------- تحميل المستخدم الحالي ----------------------
    async function loadCurrentUser() {
        const { data: { user } } = await supabase.auth.getUser();
        if (user) {
            const { data: profile } = await supabase.from('users').select('*').eq('id', user.id).single();
            currentUser = profile || { id: user.id, username: user.email.split('@')[0], avatar: 'https://randomuser.me/api/portraits/lego/1.jpg' };
        } else {
            // مستخدم ضيف (نأخذ أول مستخدم تجريبي)
            const { data: guest } = await supabase.from('users').select('*').limit(1).single();
            currentUser = guest;
            if (!guest) showToast("لا توجد بيانات مستخدمين", true);
        }
    }

    // ---------------------- جلب بيانات المستخدم المعروض ----------------------
    async function fetchUserData(userId) {
        const { data, error } = await supabase.from('users').select('*').eq('id', userId).single();
        if (error) return null;
        return data;
    }

    // ---------------------- جلب إجمالي الإعجابات للمستخدم ----------------------
    async function fetchUserTotalLikes(userId) {
        const { data, error } = await supabase.from('posts').select('likes_count').eq('author_id', userId);
        if (error) return 0;
        return data.reduce((sum, p) => sum + (p.likes_count || 0), 0);
    }

    // ---------------------- جلب حالة المتابعة ----------------------
    async function isFollowing(followerId, followingId) {
        if (!followerId || !followingId) return false;
        const { data, error } = await supabase.from('follows').select('id').eq('follower_id', followerId).eq('following_id', followingId).single();
        return !!data;
    }

    // ---------------------- عرض الملف الشخصي ----------------------
    async function renderProfile() {
        const params = new URLSearchParams(window.location.search);
        const userIdParam = params.get('user');
        if (userIdParam) {
            viewedUser = await fetchUserData(userIdParam);
            if (!viewedUser) viewedUser = currentUser;
        } else {
            viewedUser = currentUser;
        }
        if (!viewedUser) {
            document.getElementById('profileHeader').innerHTML = '<div style="color:red; text-align:center;">المستخدم غير موجود</div>';
            return;
        }

        const totalLikes = await fetchUserTotalLikes(viewedUser.id);
        const isFollowingUser = currentUser ? await isFollowing(currentUser.id, viewedUser.id) : false;
        const isOwnProfile = (currentUser && currentUser.id === viewedUser.id);

        // بناء روابط التواصل
        let socialHtml = '';
        if (viewedUser.social) {
            for (let [platform, value] of Object.entries(viewedUser.social)) {
                let icon = '';
                if (platform === 'email') icon = 'fas fa-envelope';
                else if (platform === 'facebook') icon = 'fab fa-facebook';
                else if (platform === 'twitter') icon = 'fab fa-twitter';
                else if (platform === 'instagram') icon = 'fab fa-instagram';
                else if (platform === 'tiktok') icon = 'fab fa-tiktok';
                else if (platform === 'youtube') icon = 'fab fa-youtube';
                else icon = 'fas fa-link';
                socialHtml += `<a href="#" onclick="showToast('رابط ${platform}: ${value}')"><i class="${icon}"></i></a>`;
            }
        }

        const headerHtml = `
            <img src="${viewedUser.avatar || 'https://randomuser.me/api/portraits/lego/1.jpg'}" class="profile-avatar" id="profileAvatarImg" onerror="this.src='https://randomuser.me/api/portraits/lego/1.jpg'">
            <div class="profile-name">${escapeHtml(viewedUser.username)}</div>
            <div class="profile-username">@${viewedUser.unique_name || viewedUser.username}</div>
            <div class="profile-bio">${escapeHtml(viewedUser.bio || '')}</div>
            <div class="profile-stats">
                <span><strong>${formatNumber(viewedUser.followers || 0)}</strong> متابع</span>
                <span><strong>${formatNumber(viewedUser.following || 0)}</strong> متبعهم</span>
                <span><strong>${formatNumber(totalLikes)}</strong> إعجاب</span>
            </div>
            ${!isOwnProfile ? `<button class="follow-btn ${isFollowingUser ? 'following' : ''}" id="followActionBtn">${isFollowingUser ? 'إلغاء المتابعة' : 'متابعة'}</button>` : ''}
            <div class="social-links">${socialHtml}</div>
            <div class="unique-url">🔗 الرابط الفريد: /user/${viewedUser.unique_name || viewedUser.username}</div>
        `;
        document.getElementById('profileHeader').innerHTML = headerHtml;

        // إظهار/إخفاء زر الإعدادات في الهيدر
        const settingsHeaderBtn = document.getElementById('settingsHeaderBtn');
        const settingsTabBtn = document.getElementById('settingsTabBtn');
        if (isOwnProfile) {
            settingsHeaderBtn.style.display = 'block';
            settingsTabBtn.style.display = 'block';
        } else {
            settingsHeaderBtn.style.display = 'none';
            settingsTabBtn.style.display = 'none';
        }

        // زر المتابعة
        const followBtn = document.getElementById('followActionBtn');
        if (followBtn && !isOwnProfile) {
            followBtn.onclick = async () => {
                if (!currentUser) { showToast('يجب تسجيل الدخول', true); return; }
                if (isFollowingUser) {
                    const { error } = await supabase.from('follows').delete().eq('follower_id', currentUser.id).eq('following_id', viewedUser.id);
                    if (error) { showToast(error.message, true); return; }
                    followBtn.innerText = 'متابعة';
                    followBtn.classList.remove('following');
                    showToast(`✅ تم إلغاء متابعة ${viewedUser.username}`);
                } else {
                    const { error } = await supabase.from('follows').insert({ follower_id: currentUser.id, following_id: viewedUser.id });
                    if (error) { showToast(error.message, true); return; }
                    followBtn.innerText = 'إلغاء المتابعة';
                    followBtn.classList.add('following');
                    showToast(`✅ تمت متابعة ${viewedUser.username}`);
                }
                // تحديث عدد المتابعين في الواجهة
                const { data: newCount } = await supabase.from('follows').select('id', { count: 'exact', head: true }).eq('following_id', viewedUser.id);
                const newFollowers = newCount?.count || 0;
                viewedUser.followers = newFollowers;
                const statsSpan = document.querySelector('.profile-stats span:first-child strong');
                if (statsSpan) statsSpan.innerText = formatNumber(newFollowers);
                // إعادة تعيين المتغير المحلي
                isFollowingUser = !isFollowingUser;
            };
        }
    }

    // ---------------------- جلب المنشورات للمستخدم ----------------------
    async function fetchUserPosts(userId) {
        const { data, error } = await supabase.from('posts').select('*').eq('author_id', userId).eq('hidden', false).order('created_at', { ascending: false });
        if (error) return [];
        return data;
    }

    // ---------------------- جلب المفضلات للمستخدم ----------------------
    async function fetchUserFavorites(userId) {
        const { data, error } = await supabase.from('favorites').select('post_id').eq('user_id', userId);
        if (error) return [];
        const postIds = data.map(f => f.post_id);
        if (postIds.length === 0) return [];
        const { data: posts, error: postsError } = await supabase.from('posts').select('*').in('id', postIds).eq('hidden', false);
        if (postsError) return [];
        return posts;
    }

    // ---------------------- عرض المحتوى حسب التبويب ----------------------
    let currentTab = 'posts';
    async function renderContent() {
        const container = document.getElementById('profileContent');
        container.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-pulse"></i><p>جاري التحميل...</p></div>';
        if (!viewedUser) return;

        if (currentTab === 'posts') {
            const posts = await fetchUserPosts(viewedUser.id);
            if (posts.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="far fa-newspaper"></i><p>لا توجد منشورات</p></div>';
                return;
            }
            let html = '';
            for (let p of posts) {
                const shortContent = p.content.length > 100 ? p.content.substring(0, 100) + '...' : p.content;
                html += `
                    <div class="post-item" data-post-id="${p.id}">
                        <div class="post-title">${escapeHtml(p.title)} <span style="font-size:11px; background:#2c2c2c; padding:2px 8px; border-radius:20px;">${p.category || 'عام'}</span></div>
                        <div class="post-excerpt">${escapeHtml(shortContent)}</div>
                        <div style="font-size:11px; color:#777; margin-top:6px;">❤️ ${formatNumber(p.likes_count)} | 💬 ${p.comments_count} | 👁️ ${formatNumber(p.views_count)}</div>
                    </div>
                `;
            }
            container.innerHTML = html;
            document.querySelectorAll('.post-item').forEach(el => {
                el.addEventListener('click', () => window.location.href = `home.html?post=${el.dataset.postId}`);
            });
        } 
        else if (currentTab === 'favorites') {
            const favPosts = await fetchUserFavorites(viewedUser.id);
            if (favPosts.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="far fa-star"></i><p>لا توجد منشورات في المفضلات</p></div>';
                return;
            }
            let html = '';
            for (let p of favPosts) {
                const shortContent = p.content.length > 100 ? p.content.substring(0, 100) + '...' : p.content;
                html += `
                    <div class="post-item" data-post-id="${p.id}">
                        <div class="post-title">${escapeHtml(p.title)} <span style="font-size:11px; background:#2c2c2c; padding:2px 8px; border-radius:20px;">${p.category || 'عام'}</span></div>
                        <div class="post-excerpt">${escapeHtml(shortContent)}</div>
                        <div style="font-size:11px; color:#777; margin-top:6px;">❤️ ${formatNumber(p.likes_count)} | 💬 ${p.comments_count}</div>
                    </div>
                `;
            }
            container.innerHTML = html;
            document.querySelectorAll('.post-item').forEach(el => {
                el.addEventListener('click', () => window.location.href = `home.html?post=${el.dataset.postId}`);
            });
        } 
        else if (currentTab === 'settings' && currentUser && currentUser.id === viewedUser.id) {
            // لوحة الإعدادات
            const user = currentUser;
            const social = user.social || {};
            const html = `
                <div class="settings-panel">
                    <div class="settings-group">
                        <label class="settings-label">الصورة الرمزية</label>
                        <div class="avatar-upload">
                            <img src="${user.avatar || 'https://randomuser.me/api/portraits/lego/1.jpg'}" class="avatar-preview-small" id="avatarPreview">
                            <label class="file-input-label">
                                <i class="fas fa-upload"></i> رفع صورة
                                <input type="file" id="avatarUpload" accept="image/*" style="display:none;">
                            </label>
                        </div>
                    </div>
                    <div class="settings-group">
                        <label class="settings-label">السيرة الذاتية</label>
                        <textarea id="bioInput" class="settings-input settings-textarea" rows="3">${escapeHtml(user.bio || '')}</textarea>
                    </div>
                    <div class="settings-group">
                        <label class="settings-label">روابط التواصل (اترك فارغاً إن لم ترغب)</label>
                        <input type="text" id="socialEmail" class="settings-input" placeholder="البريد الإلكتروني" value="${escapeHtml(social.email || '')}">
                        <input type="text" id="socialFacebook" class="settings-input" placeholder="فيسبوك" value="${escapeHtml(social.facebook || '')}">
                        <input type="text" id="socialTwitter" class="settings-input" placeholder="تويتر" value="${escapeHtml(social.twitter || '')}">
                        <input type="text" id="socialInstagram" class="settings-input" placeholder="انستغرام" value="${escapeHtml(social.instagram || '')}">
                        <input type="text" id="socialTiktok" class="settings-input" placeholder="تيك توك" value="${escapeHtml(social.tiktok || '')}">
                        <input type="text" id="socialYoutube" class="settings-input" placeholder="يوتيوب" value="${escapeHtml(social.youtube || '')}">
                    </div>
                    <div class="settings-group">
                        <label class="settings-label">الرابط الفريد (اسم المستخدم)</label>
                        <input type="text" id="uniqueNameInput" class="settings-input" placeholder="بدون مسافات" value="${escapeHtml(user.unique_name || '')}">
                    </div>
                    <button class="settings-save-btn" id="saveSettingsBtn">💾 حفظ التغييرات</button>
                </div>
            `;
            container.innerHTML = html;

            // رفع الصورة
            const fileInput = document.getElementById('avatarUpload');
            const avatarPreview = document.getElementById('avatarPreview');
            fileInput.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => { avatarPreview.src = ev.target.result; };
                    reader.readAsDataURL(file);
                }
            };
            // حفظ الإعدادات
            document.getElementById('saveSettingsBtn').onclick = async () => {
                const newBio = document.getElementById('bioInput').value.trim();
                const newEmail = document.getElementById('socialEmail').value.trim();
                const newFacebook = document.getElementById('socialFacebook').value.trim();
                const newTwitter = document.getElementById('socialTwitter').value.trim();
                const newInstagram = document.getElementById('socialInstagram').value.trim();
                const newTiktok = document.getElementById('socialTiktok').value.trim();
                const newYoutube = document.getElementById('socialYoutube').value.trim();
                let newUniqueName = document.getElementById('uniqueNameInput').value.trim();
                let newAvatar = avatarPreview.src;

                // التحقق من عدم تكرار الرابط الفريد
                if (newUniqueName) {
                    const { data: existing } = await supabase.from('users').select('id').eq('unique_name', newUniqueName).neq('id', currentUser.id).single();
                    if (existing) {
                        showToast("⚠️ هذا الرابط الفريد مستخدم من قبل", true);
                        return;
                    }
                }
                // رفع الصورة إلى Supabase Storage (اختياري، هنا نكتفي بتحديث الرابط)
                const updates = {
                    bio: newBio,
                    social: {
                        email: newEmail,
                        facebook: newFacebook,
                        twitter: newTwitter,
                        instagram: newInstagram,
                        tiktok: newTiktok,
                        youtube: newYoutube
                    },
                    unique_name: newUniqueName || null,
                    avatar: newAvatar.startsWith('blob:') ? currentUser.avatar : newAvatar // نحتفظ بالقديم إذا كانت مؤقتة
                };
                const { error } = await supabase.from('users').update(updates).eq('id', currentUser.id);
                if (error) { showToast(error.message, true); return; }
                showToast("✅ تم حفظ التغييرات");
                // تحديث بيانات currentUser
                currentUser = { ...currentUser, ...updates };
                viewedUser = currentUser;
                renderProfile();
                setTab('settings');
            };
        }
    }

    // تبديل التبويبات
    function setTab(tabId) {
        currentTab = tabId;
        document.querySelectorAll('.tab').forEach(tab => {
            if (tab.dataset.tab === tabId) tab.classList.add('active');
            else tab.classList.remove('active');
        });
        renderContent();
    }

    // ---------------------- الأحداث الرئيسية ----------------------
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => setTab(tab.dataset.tab));
    });
    document.getElementById('settingsHeaderBtn').addEventListener('click', () => {
        if (currentUser && viewedUser && currentUser.id === viewedUser.id) setTab('settings');
    });

    // ---------------------- الوضع الليلي ----------------------
    function applyTheme() {
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark');
            document.body.classList.remove('light');
        } else {
            document.body.classList.add('light');
            document.body.classList.remove('dark');
        }
    }
    document.getElementById('darkModeToggle')?.addEventListener('click', () => {
        localStorage.setItem('darkMode', !document.body.classList.contains('dark'));
        applyTheme();
    });
    applyTheme();

    // ---------------------- بدء التشغيل ----------------------
    (async () => {
        await loadCurrentUser();
        if (!currentUser) {
            showToast("تعذر تحميل بيانات المستخدم", true);
            return;
        }
        await renderProfile();
        setTab('posts');
    })();
</script>
</body>
</html>
